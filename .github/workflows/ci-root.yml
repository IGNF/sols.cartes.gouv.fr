name: CI root

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-root.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-root.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root:
    name: Root scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bunx tsc --noEmit --strict --module preserve --moduleResolution bundler --target esnext --types bun scripts/*.ts
      - run: bun scripts/build-all.ts --skip-build
