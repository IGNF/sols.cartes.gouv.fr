name: CI root

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-root.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-root.yml'

jobs:
  root:
    name: Root scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bunx tsc --noEmit --strict --module preserve --moduleResolution bundler --target esnext --types bun scripts/*.ts
      - run: bun scripts/build-all.ts --skip-build
