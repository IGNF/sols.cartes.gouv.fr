name: CI carto

on:
  push:
    branches: [main]
    paths:
      - 'apps/explorer-les-cartes/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-carto.yml'
  pull_request:
    paths:
      - 'apps/explorer-les-cartes/**'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.github/workflows/ci-carto.yml'

jobs:
  carto:
    name: Lint, type-check, test, build (apps/explorer-les-cartes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/explorer-les-cartes
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # --if-present: a brick without the script yet is skipped, like scripts/run-all.ts does
      - run: bun run --if-present lint
      - run: bun run --if-present typecheck
      - run: bun run --if-present test
      - run: bun run --if-present build
