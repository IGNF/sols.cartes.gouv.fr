name: CI catalogue

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/rechercher-une-donnee/**'
      - 'doc/agents/edito.md'
      # read by lint (patch list), the build (shared CSS) and the tests (header script)
      - 'doc/catalogue-patches.md'
      - 'apps/accueil/src/css/site.css'
      - 'apps/accueil/src/js/header.js'
      - '.nvmrc'
      - '.github/workflows/ci-catalogue.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/rechercher-une-donnee/**'
      - 'doc/agents/edito.md'
      # read by lint (patch list), the build (shared CSS) and the tests (header script)
      - 'doc/catalogue-patches.md'
      - 'apps/accueil/src/css/site.css'
      - 'apps/accueil/src/js/header.js'
      - '.nvmrc'
      - '.github/workflows/ci-catalogue.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalogue:
    name: Lint, test, build (apps/rechercher-une-donnee)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/rechercher-une-donnee
    steps:
      - uses: actions/checkout@v7
      # Every step below is skipped while the brick has no lockfile yet (task C2 creates it)
      - uses: actions/setup-node@v7
        if: hashFiles('apps/rechercher-une-donnee/package-lock.json') != ''
        with:
          node-version-file: .nvmrc
          cache: npm
          # upstream.json pins the geonetwork-ui commit whose lockfile is actually installed
          cache-dependency-path: |
            apps/rechercher-une-donnee/package-lock.json
            apps/rechercher-une-donnee/upstream.json
      - run: npm ci
        if: hashFiles('apps/rechercher-une-donnee/package-lock.json') != ''
      - run: npm run lint --if-present
        if: hashFiles('apps/rechercher-une-donnee/package-lock.json') != ''
      - run: npm run test --if-present
        if: hashFiles('apps/rechercher-une-donnee/package-lock.json') != ''
      - run: npm run build
        if: hashFiles('apps/rechercher-une-donnee/package-lock.json') != ''
