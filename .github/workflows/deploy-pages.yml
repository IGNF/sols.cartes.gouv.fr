name: Deploy GitHub Pages preview

# Preview of the whole site (3 bricks) at https://ignf.github.io/sols.cartes.gouv.fr/ (project site),
# built with SITE_BASE=/sols.cartes.gouv.fr/ (doc/ci.md).
on:
  push:
    branches: [feat/gh-pages-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the three bricks under /sols.cartes.gouv.fr/
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # The catalogue build clones the pinned geonetwork-ui and runs npm ci in it (scripts/prepare.mjs).
      - run: bun run build:all
        env:
          SITE_BASE: /sols.cartes.gouv.fr/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
