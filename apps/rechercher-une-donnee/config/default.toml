datahub.pageTitle.home = "Rechercher une donnée"
datahub.pageTitle.recordSearch = "Rechercher une donnée"
datahub.header.title.html = '<h1 class="fr-h2 fr-mb-0">Rechercher une donnée sur les sols</h1>'
search.filters.title = "Affiner votre recherche"
# Nom accessible (title) du bouton icône « Voir sur la carte » de l'aperçu carte (C4).
record.externalViewer.open = "Voir sur la carte"
