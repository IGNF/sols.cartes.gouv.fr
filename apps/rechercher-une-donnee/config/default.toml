# Configuration geonetwork-ui (datahub) de sols.cartes.gouv.fr, brique catalogue.
# Copiée sur conf/default.toml du clone amont par scripts/prepare.mjs.
# Toutes les options sont documentées dans conf/default.toml du fork IGNF/geonetwork-ui
# à la ref de upstream.json ; voir aussi doc/agents/geonetwork-ui.md.

[global]
geonetwork4_api_url = "https://data.geopf.fr/catalog"
datahub_url = "/rechercher-une-donnee"
proxy_path = ""

[theme]
primary_color = "#000091"
secondary_color = "#6a6af4"
main_color = "#212029"
background_color = "#fdfbff"
header_background = "var(--color-white)"
header_foreground_color = '#212029'
favicon = "/rechercher-une-donnee/assets/dsfr/favicon/favicon.ico"
# Police du DSFR (Marianne, fournie par le CSS DSFR du build) au lieu de Rubik/Readex Pro par défaut
main_font = "Marianne, arial, sans-serif"
title_font = "Marianne, arial, sans-serif"
# Vignette par défaut (fiche sans aperçu ou image en erreur) : fichier de overlay/, couleurs DSFR.
thumbnail_placeholder = 'assets/img/sols-placeholder.svg'

[search]
# Toutes les fiches du périmètre sont des jeux de données : pas de filtre rapide par type.
record_kind_quick_filter = false
# Le filtre « organization » est retiré : ses valeurs proviennent d'agrégations non filtrées
# (tout le catalogue cartes.gouv.fr), cf. doc/agents/geonetwork-ui.md §2.2.
advanced_filters = ['topic', 'publicationYear', 'format', 'license']
# Périmètre « sols » permanent, ajouté à chaque recherche (patch 0001, doc/catalogue-patches.md).
# Même filtre que le sous-portail GeoNetwork gissol-osf_c et le CSW de référence.
config_filters.groupPublished = ['gissol-osf_g']

[metadata-quality]
# Désactivé : les fiches GPF n'ont pas l'indicateur (avertissement console sinon).
enabled = false

[map]
max_feature_count = 5000
do_not_use_default_basemap = true
# Bouton « Voir sur la carte » de l'aperçu carte d'une fiche : format de cartes.gouv.fr (question C-3, suite C6),
# chemin relatif (même origine, pas de domaine en dur). Variables remplacées par le datahub IGN
# (openInIgnExternalViewer) : ${layer_name} (non encodé), ${geop_type} (OGC, ou GPP pour TMS), ${service_type}
# (WMS, WMTS, TMS en majuscules ; WFS désactivé), ${tms_style} (« ;<style> » pour TMS, vide sinon).
external_viewer_url_template = '/explorer-les-cartes/?l=${layer_name}$GEOPORTAIL:${geop_type}:${service_type}(1;1;1;0${tms_style})&permalink=no'
# Même onglet : navigation interne au site.
external_viewer_open_new_tab = false

# Fond de l'aperçu carte : Plan IGN v2 en tuiles WMTS (cache GPF, PM = Web Mercator) plutôt qu'en WMS wms-r,
# qui renvoyait des 400 ou 502 sur certaines tuiles (C7).
[[map_layer]]
type = 'xyz'
url = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}'

[translations.fr]
