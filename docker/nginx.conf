# Serves the static tree assembled by `bun run build:all` (dist/) under one origin.
# Sub-applications are SPAs: unknown paths under their prefix fall back to their index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /rechercher-une-donnee/ {
        try_files $uri $uri/ /rechercher-une-donnee/index.html;
    }

    location /explorer-les-cartes/ {
        try_files $uri $uri/ /explorer-les-cartes/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
