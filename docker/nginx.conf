# Sert l'arbre statique assemblé par `bun run build:all` (dist/) sous une seule origine.
# Tout ce qui est écrit à l'exécution va dans /tmp : le conteneur tourne en lecture seule.
pid /tmp/nginx.pid;
worker_processes 1;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;

	sendfile on;
	keepalive_timeout 65;

	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp_path;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	server {
		listen 8080;
		listen [::]:8080;
		server_name _;
		server_tokens off;
		autoindex off;
		# Derrière le reverse proxy : redirections relatives, sans le port interne
		absolute_redirect off;
		port_in_redirect off;

		root /usr/share/nginx/html;
		index index.html;
		error_page 404 /404.html;

		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;

		# Catalogue et carto sont des SPA : repli sur leur index.html
		location /rechercher-une-donnee/ {
			try_files $uri $uri/ /rechercher-une-donnee/index.html;
		}

		location /explorer-les-cartes/ {
			try_files $uri $uri/ /explorer-les-cartes/index.html;
		}

		# Edito : pages statiques
		location / {
			try_files $uri $uri/ $uri.html =404;
		}
	}
}
